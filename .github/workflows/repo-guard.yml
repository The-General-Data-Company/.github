name: repo-guard
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: The-General-Data-Company/.github
          path: .guard
      - name: Determine the range to check
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            # First push, new branch or tag, or a force push that dropped the old commit: check all history up to the pushed commit.
            range="$(git hash-object -t tree /dev/null)..$SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
      - name: Block data files and large files
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: python3 .guard/guard/check_files.py "$RANGE"
      - name: Scan for secrets
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --log-opts="$RANGE" --no-banner --redact
