name: repo-guard
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: The-General-Data-Company/.github
          path: .guard
          persist-credentials: false
      - name: Determine the range to check
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            # First push, new branch or tag, or a force push that dropped the old commit: check all history up to the pushed commit.
            range="$(git hash-object -t tree /dev/null)..$SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
      - name: Block data files and large files
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: python3 .guard/guard/check_files.py "$RANGE"
      - name: Scan for secrets
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          t="$RUNNER_TEMP/gitleaks.tgz"
          curl -sSLf -o "$t" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $t" | sha256sum -c -
          tar xzf "$t" -C "$RUNNER_TEMP" gitleaks
          # gitleaks exits 0 when git log fails; the file check above runs first on the same range and fails closed.
          # Ignore files in the repository cannot suppress findings; false positives go into guard/gitleaks.toml.
          rm -f .gitleaksignore
          "$RUNNER_TEMP/gitleaks" git . --config .guard/guard/gitleaks.toml --ignore-gitleaks-allow --log-opts="--diff-merges=first-parent $RANGE" --no-banner --redact
