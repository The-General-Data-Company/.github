name: assign-new-issues
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Assign the issue to the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$NUMBER" --add-assignee levinschwab -R "$REPO"
