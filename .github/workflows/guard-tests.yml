name: guard-tests
on: push
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests of the repository guard
        run: python3 -B -m unittest guard/tests/test_check_files.py -v
